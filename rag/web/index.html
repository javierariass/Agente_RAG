<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agente RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 3.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"
            />
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">Agente RAG</span>
          <span class="brand-sub">Consulta documental</span>
        </div>
      </div>

      <div class="topbar-actions">
        <span
          id="status-indicator"
          class="status status--unknown"
          title="Estado LM Studio"
        >
          <span class="status-led" aria-hidden="true"></span>
          <span class="status-text">comprobando…</span>
        </span>
        <button id="clear-btn" class="ghost-btn" title="Limpiar conversación" aria-label="Limpiar conversación">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6 7h12v2H6V7Zm2 3h8l-1 11H9L8 10Zm2-6h4l1 2H9l1-2Z"
            />
          </svg>
        </button>
        <button id="theme-toggle" class="ghost-btn" title="Cambiar tema" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M21 12.79A9 9 0 0 1 11.21 3a7 7 0 1 0 9.79 9.79Z"
            />
          </svg>
        </button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-badge">RAG</div>
        <h1>¿En qué te ayudo hoy?</h1>
        <p>
          Pregunta sobre resoluciones, decretos, auditorías, indicadores
          y demás documentos cargados.
        </p>
      </div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div class="composer-wrap">
        <textarea
          id="input"
          rows="1"
          placeholder="Escribe tu pregunta…"
          aria-label="Escribe tu pregunta"
        ></textarea>
        <button id="send" type="submit" class="send-btn" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.4 20.4 22 12 3.4 3.6 3 10l13 2-13 2 .4 6.4Z"
            />
          </svg>
        </button>
      </div>
      <p class="hint">
        <kbd>Enter</kbd> enviar &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd>
        nueva línea
      </p>
    </form>

    <script src="config.js" onerror="void 0"></script>
    <script src="app.js"></script>
  </body>
</html>
